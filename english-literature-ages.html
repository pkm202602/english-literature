<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ages & Periods of English Literature</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header Section -->
    <header class="bg-slate-800 border-b border-slate-700 py-8 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-indigo-400">Ages & Periods of English Literature</h1>
            <p class="mt-2 text-slate-400 text-sm sm:text-base">A historical timeline cataloging eras, influential writers, and iconic masterworks.</p>
            
            <!-- Search Bar -->
            <div class="mt-6 max-w-md mx-auto">
                <input type="text" id="searchInput" placeholder="Search by period, writer, or work..." 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-400 text-slate-200 placeholder-slate-500 text-sm">
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cardsGrid">
            <!-- Cards injected dynamically via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-6 text-center text-slate-500 text-xs">
        <p>Hosted on GitHub Pages • English Literature Milestone Project</p>
    </footer>

    <!-- JavaScript Dataset & Logic -->
    <script>
        const literatureAges = [
            {
                period: "Old English (Anglo-Saxon) Period",
                dates: "450–1066",
                overview: "Marked by the invasion of Celtic England by Germanic tribes. Literature was mostly oral and religious or heroic in nature.",
                writers: "Anonymous Bards / Poets",
                works: "Beowulf, The Wanderer, The Seafarer, Cædmon's Hymn"
            },
            {
                period: "Middle English Period",
                dates: "1066–1500",
                overview: "Triggered by the Norman Conquest. Shifted toward chivalric romances, religious mystery plays, and sharp social satire.",
                writers: "Geoffrey Chaucer, The Pearl Poet, Sir Thomas Malory",
                works: "The Canterbury Tales, Sir Gawain and the Green Knight, Le Morte d'Arthur"
            },
            {
                period: "The Renaissance (Early Modern) Period",
                dates: "1500–1660",
                overview: "Influenced by European humanism. Subdivided into Tudor, Elizabethan, Jacobean, Caroline, and Commonwealth eras.",
                writers: "William Shakespeare, Christopher Marlowe, John Milton, John Donne, Ben Jonson",
                works: "Hamlet, Doctor Faustus, Paradise Lost, Holy Sonnets, Volpone"
            },
            {
                period: "The Neoclassical Period",
                dates: "1660–1798",
                overview: "Emphasized reason, order, logic, and classical restraint (divided into Restoration, Augustan, and Age of Sensibility).",
                writers: "Alexander Pope, Jonathan Swift, Daniel Defoe, Samuel Johnson, John Dryden",
                works: "Gulliver's Travels, Robinson Crusoe, The Rape of the Lock, A Dictionary of the English Language"
            },
            {
                period: "The Romantic Period",
                dates: "1798–1837",
                overview: "A revolt against neoclassical order and industrialization, prioritizing emotion, intense individualism, and awe of nature.",
                writers: "William Wordsworth, Samuel Taylor Coleridge, John Keats, Percy Bysshe Shelley, Jane Austen, Lord Byron",
                works: "Lyrical Ballads, Pride and Prejudice, Frankenstein, Ode to a Nightingale"
            },
            {
                period: "The Victorian Period",
                dates: "1837–1901",
                overview: "Named after Queen Victoria. Explored rapid industrial expansion, social class struggles, morality, and science vs. religion.",
                writers: "Charles Dickens, Charlotte Brontë, George Eliot, Thomas Hardy, Alfred Lord Tennyson, Oscar Wilde",
                works: "Great Expectations, Jane Eyre, Middlemarch, Tess of the d'Urbervilles, The Importance of Being Earnest"
            },
            {
                period: "The Edwardian and Georgian Periods",
                dates: "1901–1914",
                overview: "The twilight of the British Empire; literature heavily criticized social stratification and the rigid moral code of the Victorians.",
                writers: "George Bernard Shaw, H.G. Wells, E.M. Forster, Joseph Conrad",
                works: "Pygmalion, The Time Machine, A Room with a View, Heart of Darkness"
            },
            {
                period: "The Modern Period",
                dates: "1914–1945",
                overview: "Defined by World Wars, widespread disillusionment, and psychological depth utilizing experimental stream-of-consciousness techniques.",
                writers: "Virginia Woolf, James Joyce, T.S. Eliot, W.B. Yeats, Aldous Huxley",
                works: "Mrs. Dalloway, Ulysses, The Waste Land, Brave New World"
            },
            {
                period: "The Postmodern & Contemporary Period",
                dates: "1945–Present",
                overview: "Explores fragmentation, cultural identity, multiculturalism, globalization, and digital evolution in a post-WWII landscape.",
                writers: "Salman Rushdie, Kazuo Ishiguro, Zadie Smith, Martin Amis, Margaret Atwood",
                works: "Midnight's Children, Never Let Me Go, White Teeth, The Handmaid's Tale"
            }
        ];

        const cardsGrid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');

        function renderCards(data) {
            cardsGrid.innerHTML = '';
            if (data.length === 0) {
                cardsGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">No matching periods or writers found.</div>`;
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg flex flex-col justify-between hover:border-indigo-400 transition-colors";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="text-lg font-bold text-indigo-300">${item.period}</h3>
                            <span class="bg-indigo-950 text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded border border-indigo-800 whitespace-nowrap">${item.dates}</span>
                        </div>
                        <p class="mt-3 text-slate-300 text-xs leading-relaxed">${item.overview}</p>
                        <div class="mt-4 pt-4 border-t border-slate-700/60">
                            <p class="text-xs font-semibold text-slate-400">Key Writers:</p>
                            <p class="text-xs text-indigo-200 mt-1">${item.writers}</p>
                        </div>
                        <div class="mt-3">
                            <p class="text-xs font-semibold text-slate-400">Notable Works:</p>
                            <p class="text-xs text-slate-200 italic mt-1">${item.works}</p>
                        </div>
                    </div>
                `;
                cardsGrid.appendChild(card);
            });
        }

        // Initial Render
        renderCards(literatureAges);

        // Search Filter Logic
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = literatureAges.filter(item => 
                item.period.toLowerCase().includes(query) ||
                item.dates.toLowerCase().includes(query) ||
                item.writers.toLowerCase().includes(query) ||
                item.works.toLowerCase().includes(query) ||
                item.overview.toLowerCase().includes(query)
            );
            renderCards(filtered);
        });
    </script>
</body>
</html>
